name: Publish to NPM

on:
  push:
    branches:
      - main  # Change this if you want to trigger on a different branch

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm install

      - name: Run Linter (Optional)
        run: npm run lint
        continue-on-error: true  # Does not stop if linting fails

      - name: Run Tests (Optional)
        run: npm test
        continue-on-error: true  # Does not stop if tests fail

      - name: Check if version has changed
        id: check_version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          if npm show your-package-name version | grep -q "$VERSION"; then
            echo "Version $VERSION is already published. Skipping publish."
            exit 1
          fi

      - name: Build the package (Optional)
        run: npm run build # Change this if you don’t have a build step

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
